<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where attacks come in for a small team</title>
<desc id="d">Your team of 2 to 10 people in the middle, with the seven ways in around it and the guide step for each: Public domains (Step 1), Keys in git (Step 2), Agent config (Step 3), Long-lived keys (Step 8), New packages (Steps 4 and 5), Accounts, laptops (Step 9), CI and workflows (Steps 6 and 7).</desc>
