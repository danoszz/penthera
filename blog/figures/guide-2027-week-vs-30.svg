<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">This week and the next 30 days</title>
<desc id="d">The ten steps in two columns. This week: Know what you expose, Keep secrets out of git, Audit what your agents load, Look before you install, Know what your packages can do. The next 30 days: Put the checks in CI, Harden your workflows, Retire long-lived keys, Lock down accounts and devices, Log it and plan the bad day.</desc>
