name: Penthera Security Review
description: "Offline security review on PRs: risky dependency changes and AI agent config (MCP, skills, hooks), with SARIF."
author: danoszz
branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: "What to run: deps (dependency capability diff), agents (AI agent config audit) or scan (live URL scan)."
    required: false
    default: deps
  path:
    description: Project folder to scan, relative to the workspace.
    required: false
    default: "."
  base-ref:
    description: "Git ref or SHA to diff the lockfile against (deps mode). Defaults to the pull request base commit."
    required: false
    default: ""
  url:
    description: "Target URL (scan mode only). Scan only systems you are authorized to test."
    required: false
    default: ""
  fail-on:
    description: "Fail the job on findings at or above this severity: none, high or critical."
    required: false
    default: none
  comment:
    description: "Post or update one PR comment with the capability diff (deps mode)."
    required: false
    default: "true"
  footer:
    description: 'End the PR comment and Markdown with one "Checked by Penthera" line. Set "false" to leave it off.'
    required: false
    default: "true"
  sarif:
    description: Upload SARIF to GitHub code scanning (needs security-events write).
    required: false
    default: "true"
  penthera-version:
    description: >-
      Penthera always runs from this action's own checkout, never from npm. Set an
      exact version (for example 1.3.0) to fail the job if the pinned action ref is
      a different version.
    required: false
    default: ""
  github-token:
    description: Token for the PR comment. The default GITHUB_TOKEN is enough.
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ steps.run.outputs.sarif-file }}
  report-file:
    description: Path to the JSON report.
    value: ${{ steps.run.outputs.report-file }}
  comment-id:
    description: ID of the PR comment that was created or updated, if any.
    value: ${{ steps.comment.outputs.comment-id }}

runs:
  using: composite
  steps:
    # Inputs reach the shell only through env, never by ${{ }} interpolation.
    - name: Run Penthera
      id: run
      shell: bash
      env:
        PENTHERA_DIR: ${{ github.action_path }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_VERSION: ${{ inputs.penthera-version }}
        INPUT_FOOTER: ${{ inputs.footer }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/penthera"
        mkdir -p "$out"
        node_major=$(node -p 'process.versions.node.split(".")[0]')
        if [ "$node_major" -lt 22 ]; then
          echo "::error::Penthera needs Node 22 or newer (found $(node --version)). Add actions/setup-node with node-version: 22 before this step."
          exit 2
        fi
        bundled=$(node -p 'require(process.argv[1]).version' "$PENTHERA_DIR/package.json")
        if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$bundled" ]; then
          echo "::error::penthera-version is $INPUT_VERSION but this action ref contains $bundled. Pin the action to the commit of the release you want; it never installs Penthera from npm."
          exit 2
        fi
        echo "Penthera $bundled from $PENTHERA_DIR (mode: $INPUT_MODE)"

        args=()
        case "$INPUT_MODE" in
          deps)
            base="${INPUT_BASE_REF:-$PR_BASE_SHA}"
            if [ -n "$base" ]; then
              # A ref is a branch, tag or SHA. Anything else (a leading "-" would be
              # read as a git option) is refused before git sees it.
              case "$base" in
                -*|*..*|*[!A-Za-z0-9_./@^~{}+-]*)
                  echo "::error::base-ref is not a plain git ref: $base"
                  exit 2
                  ;;
              esac
              # Shallow checkouts lack the base commit; fetch just that one from origin.
              if ! git -C "$INPUT_PATH" cat-file -e --end-of-options "$base^{commit}" 2>/dev/null; then
                git -C "$INPUT_PATH" fetch --no-tags --depth=1 --end-of-options origin "$base" || echo "::warning::Could not fetch $base; the diff may fail."
              fi
              args+=(--base "$base")
            else
              echo "::notice::No base ref (not a pull request and base-ref unset); scanning without a diff."
            fi
            args=(deps "$INPUT_PATH" "${args[@]}" --pr-comment "$out/comment.md")
            ;;
          agents)
            # agents parses YAML frontmatter, the one runtime dependency. Install it
            # from the action's own lockfile (integrity-checked, no install scripts)
            # only if it is not already there. deps and scan need no install.
            if ! (cd "$PENTHERA_DIR" && node -e 'import("yaml")' 2>/dev/null); then
              npm ci --prefix "$PENTHERA_DIR" --omit=dev --ignore-scripts --no-audit --no-fund
            fi
            args=(agents "$INPUT_PATH")
            ;;
          scan)
            if [ -z "$INPUT_URL" ]; then
              echo "::error::mode: scan needs the url input."
              exit 2
            fi
            args=("$INPUT_URL")
            ;;
          *)
            echo "::error::mode must be deps, agents or scan, got: $INPUT_MODE"
            exit 2
            ;;
        esac

        if [ "$INPUT_FOOTER" = "false" ]; then args+=(--no-footer); fi

        set +e
        node "$PENTHERA_DIR/bin/penthera.js" "${args[@]}" --sarif "$out/penthera.sarif" -o "$out/penthera.json"
        code=$?
        set -e
        # 0 = clean, 1 = findings (fail-on decides), anything else = the scan broke.
        if [ "$code" -gt 1 ]; then exit "$code"; fi
        echo "sarif-file=$out/penthera.sarif" >> "$GITHUB_OUTPUT"
        echo "report-file=$out/penthera.json" >> "$GITHUB_OUTPUT"
        if [ -f "$out/comment.md" ]; then echo "comment-file=$out/comment.md" >> "$GITHUB_OUTPUT"; fi

    - name: Comment on the pull request
      id: comment
      if: inputs.mode == 'deps' && steps.run.outputs.comment-file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PENTHERA_DIR: ${{ github.action_path }}
        COMMENT_FILE: ${{ steps.run.outputs.comment-file }}
        INPUT_COMMENT: ${{ inputs.comment }}
      run: |
        if [ "$INPUT_COMMENT" = "true" ]; then
          node "$PENTHERA_DIR/scripts/action/comment.mjs" comment --body-file "$COMMENT_FILE"
        else
          sed '/<!-- penthera-deps -->/d' "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload SARIF
      if: inputs.sarif == 'true' && steps.run.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      continue-on-error: true # code scanning may be off, or the token read-only on forks
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: penthera-${{ inputs.mode }}

    - name: Apply fail-on
      if: inputs.fail-on != 'none'
      shell: bash
      env:
        PENTHERA_DIR: ${{ github.action_path }}
        REPORT_FILE: ${{ steps.run.outputs.report-file }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: node "$PENTHERA_DIR/scripts/action/comment.mjs" gate --report "$REPORT_FILE" --fail-on "$INPUT_FAIL_ON"
