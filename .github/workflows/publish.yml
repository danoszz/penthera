name: Publish

# Stages a release on npm when a version tag is pushed. Nothing goes live until a
# maintainer approves it with 2FA on npmjs.com (Staged Packages tab) or with
# `npm stage approve <stage-id>`. A hijacked workflow can stage, never ship.
#
# Auth is npm trusted publishing (OIDC): no npm token is stored anywhere. The
# trusted publisher on npmjs.com is configured stage-only (danoszz/penthera,
# publish.yml, "npm publish" unchecked). Provenance links the tarball to this
# workflow run and commit.
#
# Release: see CONTRIBUTING.md ("Cutting a release"). Pushing a v* tag stages.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the release job: a cache written by another
          # workflow must not feed what gets published (cache poisoning).
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm >= 11.15. Pinned by hash so the release
      # toolchain only changes through a reviewed PR: the tarball is checked
      # against the registry's sha512 integrity before it runs, and nothing is
      # installed through `npm install`. To bump: `npm view npm@<v> dist.integrity`.
      - name: Use npm 11.21.1
        env:
          NPM_VERSION: 11.21.1
          NPM_INTEGRITY: sha512-YTzL6QBEJXyHcTu0JiUc7RKMp+mzlJtl7rGLmERaXUQeFHIMc9atdr6G9M9C8vDWbv40epoTQAzNL2/PtZVDhQ==
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npm.tgz" "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          GOT="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)"
          [ "$GOT" = "$NPM_INTEGRITY" ] || { echo "npm tarball integrity mismatch: $GOT"; exit 1; }
          mkdir -p "$RUNNER_TEMP/npm"
          tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm"
          # A shim on PATH ahead of the bundled npm (bin/npm itself expects to
          # live next to the node binary).
          mkdir -p "$RUNNER_TEMP/npm/shim"
          printf '#!/bin/sh\nexec node "%s/package/bin/npm-cli.js" "$@"\n' "$RUNNER_TEMP/npm" > "$RUNNER_TEMP/npm/shim/npm"
          chmod +x "$RUNNER_TEMP/npm/shim/npm"
          echo "$RUNNER_TEMP/npm/shim" >> "$GITHUB_PATH"

      - name: Check the npm version
        run: test "$(npm --version)" = "11.21.1"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Stage on npm with provenance
        run: npm stage publish --provenance --access public

      - name: Ask for approval
        run: |
          {
            echo "## penthera@${GITHUB_REF_NAME#v} is staged on npm"
            echo
            echo "It is **not live yet**. Approve it with 2FA:"
            echo
            echo "- npmjs.com → penthera → **Staged Packages** → Approve, or"
            echo "- \`npm stage list penthera\` then \`npm stage approve <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Marketing: draft (never post) a LinkedIn and an X/Bluesky post from the
      # CHANGELOG section for this tag, for the job summary and, via the release
      # job, a collapsed "Share this release" in the release body. A person
      # posts it after approving the staged package. See docs/marketing.md.
      - name: Draft release posts
        id: draft
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/share"
          if node scripts/marketing/release-post.mjs --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/share/share.md"; then
            cat "$RUNNER_TEMP/share/share.md" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG section for $GITHUB_REF_NAME; skipping the post drafts."
          fi

      - name: Keep the drafts for the release job
        if: steps.draft.outputs.ok == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-share
          path: ${{ runner.temp }}/share/share.md
          retention-days: 7

  # Separate job so the write token never sits next to `npm ci` / `npm test`,
  # which run third-party code. No checkout: it only calls the GitHub API.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

      # Attach the post drafts (written by the publish job) to the release.
      # Only the GitHub API is called here. See docs/marketing.md.
      - name: Download release post drafts
        id: share
        continue-on-error: true # no CHANGELOG section means no drafts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-share
          path: ${{ runner.temp }}/share

      - name: Add "Share this release" to the release body
        if: steps.share.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          share="$RUNNER_TEMP/share/share.md"
          body="$RUNNER_TEMP/body.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$body"
          if ! grep -q '<!-- penthera-share -->' "$body"; then
            printf '\n\n' >> "$body"
            cat "$share" >> "$body"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$body"
          fi
