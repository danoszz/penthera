name: Publish

# Publishes to npm with build provenance when a version tag is pushed.
# Provenance cryptographically links the published tarball to this workflow run
# and commit, and npm shows a "Built and signed on GitHub Actions" badge on the
# package page. It only works from CI with OIDC, never from a laptop.
#
# Setup: add an npm automation token as the NPM_TOKEN repository secret.
# Release: npm version <patch|minor|major> && git push --follow-tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
