# Dogfood: run this repo's own action (action.yml) on PRs that change the lockfile.
# Users copy docs/examples/pr-dependency-review.yml, which pins a release SHA.

name: Dependency review

on:
  pull_request:
    branches: [main]
    paths:
      - package-lock.json
      - action.yml
      - scripts/action/**
      - .github/workflows/dependency-review.yml

permissions:
  contents: read

jobs:
  penthera:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR comment with the capability diff
      security-events: write # the upload-sarif step below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install base and PR trees without running scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && npm ci --ignore-scripts --no-audit --no-fund)
          npm ci --ignore-scripts --no-audit --no-fund

      - uses: ./
        id: penthera
        with:
          mode: deps
          # Uploaded in this workflow instead, so the write scope above sits next
          # to the step that uses it (Scorecard Token-Permissions).
          sarif: "false"

      - name: Upload SARIF
        if: steps.penthera.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        continue-on-error: true # code scanning may be off, or the token read-only on forks
        with:
          sarif_file: ${{ steps.penthera.outputs.sarif-file }}
          category: penthera-deps
