# Moves `plugin-claude-live`, the branch Anthropic's plugin directory follows, to the
# newest commit on main whose plugin pins the version npm serves as `latest`.
#
# A release PR bumps the plugin's pin before the maintainer approves the
# version on npm, so main can briefly point at a version that isn't published.
# plugin-claude-live never does: it moves only once npm has the version, and only
# forward. Runs our own script from main; no pull request code runs here.
name: Plugin live

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-live
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Move plugin-claude-live to the published plugin
        run: node scripts/ci/plugin-live.mjs
