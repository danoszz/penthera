name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (dev only, eslint.config.js)
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Versions are in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          DIRPLUGIN=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          MARKET=$(node -p "require('./.claude-plugin/marketplace.json').metadata.version")
          SKILL=$(sed -n 's/^  version: *//p' skills/penthera/SKILL.md | tr -d '"')
          LOCK=$(node -p "require('./package-lock.json').version")
          echo "package=$PKG plugin=$PLUGIN plugin/=$DIRPLUGIN marketplace=$MARKET skill=$SKILL lock=$LOCK"
          for v in "$PLUGIN" "$DIRPLUGIN" "$MARKET" "$SKILL" "$LOCK"; do
            [ "$v" = "$PKG" ] || { echo "Version drift: expected $PKG, found $v"; exit 1; }
          done

      - name: CLI smoke test
        run: node bin/penthera.js --version

      - name: Accuracy benchmark (offline, local targets)
        run: npm run bench -- --check --no-write

  provenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # PR_AUTHOR and the token let both checks pass Dependabot's verified pin bumps
      # (scripts/ci/dependabot.mjs). The token is read-only, as the workflow's permissions say.
      - name: AI disclosure trailers (CONTRIBUTING.md#use-of-generative-ai)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/provenance.mjs "origin/${{ github.base_ref }}" HEAD

      - name: Docs follow the public surface (changelog.d/README.md)
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/docs-gate.mjs "origin/${{ github.base_ref }}" HEAD

  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start mock server
        run: |
          node tests/fixtures/mock-server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done

      - name: Skill preflight
        run: bash skills/penthera/scripts/preflight.sh http://127.0.0.1:8765

      - name: Scan mock API (standard profile)
        run: |
          set +e
          node bin/penthera.js http://127.0.0.1:8765 \
            --profile standard \
            -o reports/ci-scan.json \
            --sarif reports/ci-scan.sarif
          code=$?
          set -e
          # Exit 1 = findings detected (expected on mock server)
          if [ "$code" -eq 2 ]; then exit 2; fi

      - name: Validate JSON report
        run: node skills/penthera/scripts/validate-report.mjs reports/ci-scan.json

      # Note: the SARIF is kept as a build artifact below, but NOT uploaded to this
      # repo's Code Scanning. These are findings against the deliberately-vulnerable
      # CI mock server (tests/fixtures/mock-server.js), not issues in this repo.
      # End users uploading their own scan SARIF is handled by scan.yml.

      - name: Upload scan artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: penthera-ci-reports
          path: reports/

  # The website (site/, deployed by Vercel). Builds it the way Vercel does,
  # holds the browser check to the CLI on the agents and deps fixtures, and
  # runs Penthera on the site's code and on the served pages.
  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: node site/build.mjs

      - name: Browser check against the agents and deps fixtures
        run: npx vitest run tests/site.test.js

      - name: Penthera on the site's code
        run: |
          node bin/penthera.js --repo site --offline --no-footer
          node bin/penthera.js agents site --no-footer

      - name: Penthera on the served site, with its production headers
        run: |
          node site/serve.mjs --port 4173 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          # Locally connect-src also has 'self', for the live check served in process.
          curl -sI http://127.0.0.1:4173/ | grep -i "^content-security-policy: .*connect-src [^;]*https://penthera.org/_vercel/insights/ https://penthera.org/_vercel/speed-insights/ https://www.penthera.org/_vercel/insights/ https://www.penthera.org/_vercel/speed-insights/ https://penthera.org/api/check https://www.penthera.org/api/check;"
          node bin/penthera.js http://127.0.0.1:4173 --offline --no-footer
