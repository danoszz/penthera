name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Versions are in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          MARKET=$(node -p "require('./.claude-plugin/marketplace.json').metadata.version")
          SKILL=$(sed -n 's/^  version: *//p' skills/penthera/SKILL.md | tr -d '"')
          LOCK=$(node -p "require('./package-lock.json').version")
          echo "package=$PKG plugin=$PLUGIN marketplace=$MARKET skill=$SKILL lock=$LOCK"
          for v in "$PLUGIN" "$MARKET" "$SKILL" "$LOCK"; do
            [ "$v" = "$PKG" ] || { echo "Version drift: expected $PKG, found $v"; exit 1; }
          done

      - name: CLI smoke test
        run: node bin/penthera.js --version

      - name: Accuracy benchmark (offline, local targets)
        run: npm run bench -- --check --no-write

  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start mock server
        run: |
          node tests/fixtures/mock-server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done

      - name: Skill preflight
        run: bash skills/penthera/scripts/preflight.sh http://127.0.0.1:8765

      - name: Scan mock API (standard profile)
        run: |
          set +e
          node bin/penthera.js http://127.0.0.1:8765 \
            --profile standard \
            -o reports/ci-scan.json \
            --sarif reports/ci-scan.sarif
          code=$?
          set -e
          # Exit 1 = findings detected (expected on mock server)
          if [ "$code" -eq 2 ]; then exit 2; fi

      - name: Validate JSON report
        run: node skills/penthera/scripts/validate-report.mjs reports/ci-scan.json

      # Note: the SARIF is kept as a build artifact below, but NOT uploaded to this
      # repo's Code Scanning. These are findings against the deliberately-vulnerable
      # CI mock server (tests/fixtures/mock-server.js), not issues in this repo.
      # End users uploading their own scan SARIF is handled by scan.yml.

      - name: Upload scan artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: penthera-ci-reports
          path: reports/
